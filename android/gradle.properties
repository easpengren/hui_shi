# Memory-bounded for the shared CI runner (15G box that also runs the Confucius
# Docker stack AND a second self-hosted runner). These were -Xmx8G/-Xmx4G
# metaspace, which reserves ~12G on its own — Confucius hit exactly that and
# recorded it in its own gradle.properties. The first time both APK builds
# overlapped (2026-07-31, 07:19–07:33) the Confucius Gradle daemon was killed
# mid-build: "Gradle build daemon disappeared unexpectedly".
#
# 4G heap + 1G metaspace builds this release APK comfortably. Raise it only if a
# build actually fails on heap — not because a build failed on the runner.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
